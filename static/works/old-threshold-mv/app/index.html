<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>那道旧门槛</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-lrc="lyrics.lrc">
<div class="mv is-poster" id="mv">
    <canvas id="screen" width="1280" height="720" role="img" aria-label="水粉动画 MV《那道旧门槛》：山间廊桥的一端，父亲和两个孩子从桥里走出来，小儿子走在最前面"></canvas>
    <img class="mv-poster" src="poster.webp" alt="" aria-hidden="true">
    <button class="mv-big-play" id="big-play" type="button" aria-label="播放 MV"><span aria-hidden="true"></span></button>
    <div class="mv-bar">
        <button class="mv-toggle" id="toggle" type="button" aria-label="播放"></button>
        <span class="mv-time" id="time">0:00</span>
        <input class="mv-seek" id="seek" type="range" min="0" max="259.8" step="0.01" value="0" aria-label="播放进度">
        <span class="mv-time">4:19</span>
        <button class="mv-subs" id="subs" type="button" aria-pressed="true">字幕</button>
        <button class="mv-full" id="full" type="button" aria-label="全屏"></button>
    </div>
    <audio id="song" src="song.m4a" preload="none" playsinline></audio>
</div>
<script type="module" src="src/film.js"></script>
</body>
</html>
