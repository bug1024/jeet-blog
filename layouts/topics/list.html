{{ define "main" }}
    {{ $topics := .Site.Data.topics.topics }}
    <main class="main career-page topic-index-page" id="main">
        <div class="career-shell">
            <header class="career-head topic-index-head">
                <div class="career-head-copy">
                    <h1>{{ .Title }}</h1>
                </div>
            </header>

            <ol class="topic-directory">
                {{ range $index, $topic := $topics }}
                    <li>
                        <a href="{{ printf "/topics/%s/" $topic.slug | relLangURL }}">
                            <span class="topic-directory-number">{{ printf "%02d" (add $index 1) }}</span>
                            <div>
                                <small>{{ $topic.label }}</small>
                                <h2>{{ $topic.title }}</h2>
                                <p>{{ $topic.description }}</p>
                            </div>
                            <strong>{{ $topic.article_count }}<small>篇</small></strong>
                            <span aria-hidden="true">→</span>
                        </a>
                    </li>
                {{ end }}
            </ol>
        </div>
    </main>
{{ end }}
