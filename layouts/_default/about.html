{{ define "main" }}
<main class="main single about-page" id="main">
    <div class="main-inner">
        <header class="editorial-page-head about-page-head">
            <div>
                <h1 class="post-title">关于我</h1>
            </div>
            <span class="editorial-blue-block" aria-hidden="true"></span>
        </header>
        <div class="about-layout">
            <aside class="about-journey" aria-label="福州、北京、南京三段人生轨迹">
                <ol>
                    <li class="journey-origin">
                        <span class="journey-node" aria-hidden="true"></span>
                        <div><time>2010—2016</time><strong>福州</strong></div>
                    </li>
                    <li class="journey-building">
                        <span class="journey-node" aria-hidden="true"></span>
                        <div><time>2016—2023</time><strong>北京</strong></div>
                    </li>
                    <li class="journey-present">
                        <span class="journey-node" aria-hidden="true"></span>
                        <div><time>2023—至今</time><strong>南京</strong></div>
                    </li>
                </ol>
                <nav class="about-directory" aria-label="本页目录">
                    <span>本页</span>
                    <a href="#经历"><small>01</small>经历</a>
                    <a href="#工作与系统"><small>02</small>工作与系统</a>
                    <a href="#生活与时间"><small>03</small>生活与时间</a>
                    <a href="#关于写作"><small>04</small>关于写作</a>
                </nav>
            </aside>
            <article class="content post about-article">
                <div class="post-body e-content">{{ .Content }}</div>
                <figure class="about-yaya">
                    <span class="about-diary" aria-hidden="true"><img src="{{ "/images/illustrations/about-diary.png" | relURL }}" alt="" loading="lazy" decoding="async"></span>
                    <img src="{{ "/images/illustrations/yaya-mac-kitten.png" | relURL }}" width="1536" height="1024" alt="幼猫丫丫从 Mac 电脑屏幕后探出头" loading="lazy" decoding="async">
                    <canvas data-yaya data-yaya-still data-src="{{ "/images/illustrations/yaya-mac-kitten.png" | relURL }}" data-yaya-eyes='[{"x":430,"y":240,"rx":29,"ry":29,"angle":-0.15},{"x":551,"y":225,"rx":28,"ry":29,"angle":-0.15}]' width="1536" height="1024" role="img" aria-label="偶尔眨眼的幼猫丫丫和 Mac 电脑"></canvas>
                </figure>
            </article>
        </div>
        <nav class="about-next" aria-label="继续阅读">
            <span>继续阅读</span>
            <a href="{{ "/tags/有感而发/" | relLangURL }}">人生与时间</a>
            <a href="{{ "/posts/" | relLangURL }}">全部文章 <span aria-hidden="true">→</span></a>
        </nav>
    </div>
</main>
{{ end }}
