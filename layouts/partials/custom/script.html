{{- with .Site.Params.baiduAnalyticsId }}
    {{- if eq hugo.Environment "production" }}
        <script>
            var _hmt = window._hmt = window._hmt || [];
            (function () {
                var hm = document.createElement("script");
                hm.src = "https://hm.baidu.com/hm.js?{{ . }}";
                var script = document.getElementsByTagName("script")[0];
                script.parentNode.insertBefore(hm, script);
            })();
        </script>
    {{- end }}
{{- end }}
<script type="module" src="{{ "/js/header-boundary.js" | relURL }}"></script>
{{- if or .IsHome (eq .Layout "about") }}
    <script type="module" src="{{ "/js/yaya-portrait.js" | relURL }}"></script>
{{- end }}
